
name: Release Download Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-download-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check downloads and notify
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          import subprocess

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "release-download-alerts"
          }

          def request(url, data=None, headers_override=None):
              req = urllib.request.Request(
                  url, data=data,
                  headers=headers_override or headers
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Read all release assets
          current = {}
          page = 1
          while True:
              releases = request(
                  f"https://api.github.com/repos/{repo}/releases"
                  f"?per_page=100&page={page}"
              )
              for release in releases:
                  for asset in release.get("assets", []):
                      current[str(asset["id"])] = {
                          "name": asset["name"],
                          "count": asset["download_count"]
                      }
              if len(releases) < 100:
                  break
              page += 1

          # Retrieve previous state from dedicated branch
          state = {}
          try:
              url = (f"https://api.github.com/repos/{repo}"
                     "/contents/download-counts.json"
                     "?ref=download-alert-state")
              import base64
              response = request(url)
              state = json.loads(base64.b64decode(
                  response["content"]
              ))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          # First run establishes baseline
          if state:
              for asset_id, asset in current.items():
                  previous = state.get(asset_id)
                  if previous is None:
                      continue
                  delta = asset["count"] - previous
                  if delta > 0:
                      message = (
                          f"{asset['name']}\n"
                          f"New downloads: {delta}\n"
                          f"Total: {asset['count']}"
                      )
                      payload = urllib.parse.urlencode({
                          "token": os.environ["PUSHOVER_API_TOKEN"],
                          "user": os.environ["PUSHOVER_USER_KEY"],
                          "title": "Studio Session Download",
                          "message": message,
                          "url": f"https://github.com/{repo}/releases"
                      }).encode()
                      request(
                          "https://api.pushover.net/1/messages.json",
                          payload,
                          {"Content-Type":
                           "application/x-www-form-urlencoded"}
                      )
                      print(message)

          # Save state in a dedicated orphan branch
          subprocess.run(
              ["git", "init", "-q", "state"], check=True
          )
          os.chdir("state")
          subprocess.run(
              ["git", "config", "user.name", "github-actions"],
              check=True
          )
          subprocess.run(
              ["git", "config", "user.email",
               "github-actions@users.noreply.github.com"],
              check=True
          )
          with open("download-counts.json", "w") as f:
              json.dump(
                  {k: v["count"] for k, v in current.items()},
                  f, indent=2
              )
          subprocess.run(["git", "add", "."], check=True)
          subprocess.run(
              ["git", "commit", "-qm", "Update download counts"],
              check=True
          )
          remote = (
              f"https://x-access-token:{token}"
              f"@github.com/{repo}.git"
          )
          subprocess.run(
              ["git", "push", "--force", remote,
               "HEAD:refs/heads/download-alert-state"],
              check=True
          )
          print("Download counts saved.")
          PY
